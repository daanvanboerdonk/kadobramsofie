<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <meta name="robots" content="noindex">
  <title>Een cadeau voor jullie</title>
  <style>
    :root {
      --cream: #fdf6ee;
      --blush: #f4c6c0;
      --rose: #d98a88;
      --plum: #5a2d3a;
      --gold: #c9a86a;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
      overflow: hidden;
      font-family: Georgia, "Times New Roman", serif;
      background: var(--cream);
      color: var(--plum);
      -webkit-tap-highlight-color: transparent;
    }

    section {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      padding: 2rem;
      text-align: center;
      transition: opacity 0.6s ease;
    }

    section.hidden {
      opacity: 0;
      pointer-events: none;
    }

    /* ---------- START SCREEN ---------- */
    #start {
      background: radial-gradient(circle at 50% 30%, #fff 0%, var(--cream) 45%, var(--blush) 100%);
    }

    #start .decor {
      font-size: 3rem;
      margin-bottom: 1rem;
      opacity: 0.85;
    }

    #start h1 {
      font-size: clamp(1.8rem, 6vw, 3rem);
      font-weight: normal;
      font-style: italic;
      margin: 0 0 0.5rem;
      letter-spacing: 0.02em;
    }

    #start .names {
      font-size: clamp(1rem, 3.5vw, 1.3rem);
      color: var(--rose);
      margin-bottom: 1.8rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
    }

    #start .instruction {
      font-size: clamp(1rem, 3.6vw, 1.15rem);
      line-height: 1.5;
      max-width: 24rem;
      margin: 0 auto 2rem;
      color: var(--plum);
    }

    #start-btn {
      font-family: inherit;
      font-size: clamp(1.1rem, 4vw, 1.4rem);
      padding: 1.1rem 2.2rem;
      border: none;
      border-radius: 999px;
      background: var(--plum);
      color: var(--cream);
      cursor: pointer;
      box-shadow: 0 10px 30px rgba(90, 45, 58, 0.25);
      transition: transform 0.15s ease, box-shadow 0.2s ease, opacity 0.3s ease;
      letter-spacing: 0.03em;
    }

    #start-btn:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 14px 36px rgba(90, 45, 58, 0.32);
    }

    #start-btn:active:not(:disabled) {
      transform: translateY(0);
    }

    #start-btn:disabled {
      opacity: 0.55;
      cursor: default;
    }

    #start .hint {
      margin-top: 1.2rem;
      font-size: 0.85rem;
      color: var(--rose);
      font-style: italic;
      min-height: 1.2em;
    }

    /* ---------- VIDEO SCREEN ---------- */
    #video {
      background: #000;
      padding: 0;
    }

    #player-wrap {
      position: relative;
      width: 100vw;
      height: 56.25vw;
      max-height: 100vh;
      max-width: 177.78vh;
    }

    #player {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: contain;
      background: #000;
      outline: none;
      pointer-events: none;
    }

    #overlay {
      position: absolute;
      inset: 0;
      z-index: 10;
      background: transparent;
      cursor: default;
    }

    /* ---------- GIFT SCREEN ---------- */
    #gift {
      background: radial-gradient(circle at 50% 40%, #fff 0%, var(--cream) 60%, var(--blush) 100%);
    }

    #gift .gift-content {
      max-width: 32rem;
      animation: gift-in 0.8s ease 0.2s both;
    }

    #gift .sparkle {
      font-size: 2.5rem;
      margin-bottom: 1rem;
    }

    #gift h1 {
      font-size: clamp(2rem, 7vw, 3.2rem);
      font-weight: normal;
      font-style: italic;
      margin: 0 0 1.5rem;
      color: var(--plum);
    }

    #gift p {
      font-size: clamp(1.05rem, 3.5vw, 1.25rem);
      line-height: 1.6;
      margin: 0 0 1rem;
    }

    #gift .eefje {
      margin-top: 2rem;
      font-size: 0.9rem;
      color: var(--rose);
      font-style: italic;
      letter-spacing: 0.05em;
    }

    @keyframes gift-in {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <section id="start">
    <div class="decor">💛</div>
    <h1>Een cadeau voor jullie</h1>
    <div class="names">Bram &amp; Sofie</div>
    <p class="instruction">Bekijk de video hieronder <strong>helemaal</strong> uit om jullie cadeau te verdienen.</p>
    <button id="start-btn" disabled>🎁 Klik hier voor jullie cadeau</button>
    <div class="hint" id="start-hint">Even laden…</div>
  </section>

  <section id="video" class="hidden" aria-hidden="true">
    <div id="player-wrap">
      <video id="player"
             src="stop.mp4"
             preload="auto"
             playsinline
             webkit-playsinline
             disablepictureinpicture
             disableremoteplayback
             x-webkit-airplay="deny"
             controlslist="nodownload noremoteplayback noplaybackrate nofullscreen"></video>
      <div id="overlay"></div>
    </div>
  </section>

  <section id="gift" class="hidden" aria-hidden="true">
    <div class="gift-content">
      <div class="sparkle">🎉✨</div>
      <h1>Gefeliciteerd!</h1>
      <p>Jullie hebben je doel bereikt en jullie hebben je cadeau verdiend.</p>
      <p>Stuur een foto van deze pagina naar Eefje, en zij gaat het regelen.</p>
      <div class="eefje">— met liefde</div>
    </div>
  </section>

  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
  <script>
    const startSection = document.getElementById('start');
    const videoSection = document.getElementById('video');
    const giftSection  = document.getElementById('gift');
    const startBtn     = document.getElementById('start-btn');
    const startHint    = document.getElementById('start-hint');
    const player       = document.getElementById('player');

    let ended = false;

    // Enable the start button as soon as the browser thinks it can play through.
    // Fall back to 'canplay' (needs less buffering) and a hard timeout, in case
    // the browser is conservative about 'canplaythrough' over a slow network.
    function markReady() {
      startBtn.disabled = false;
      startHint.textContent = '';
    }
    player.addEventListener('canplaythrough', markReady, { once: true });
    player.addEventListener('canplay', markReady, { once: true });
    setTimeout(markReady, 4000);

    player.addEventListener('error', () => {
      startHint.textContent = 'Oeps — video kon niet laden.';
    });

    // Resume immediately if anything pauses the video before it ends.
    player.addEventListener('pause', () => {
      if (ended) return;
      player.play().catch(() => {});
    });

    player.addEventListener('ended', () => {
      ended = true;
      showGift();
    });

    function startVideo() {
      startSection.classList.add('hidden');
      videoSection.classList.remove('hidden');
      videoSection.setAttribute('aria-hidden', 'false');
      player.muted = false;
      player.volume = 1;
      const p = player.play();
      if (p && typeof p.catch === 'function') {
        p.catch(() => {
          startHint.textContent = 'Tik nog een keer…';
        });
      }
    }

    function showGift() {
      videoSection.classList.add('hidden');
      videoSection.setAttribute('aria-hidden', 'true');
      giftSection.classList.remove('hidden');
      giftSection.setAttribute('aria-hidden', 'false');
      player.pause();
      fireConfetti();
    }

    function fireConfetti() {
      const colors = ['#d98a88', '#c9a86a', '#f4c6c0', '#ffffff', '#5a2d3a'];

      confetti({
        particleCount: 220,
        spread: 110,
        startVelocity: 45,
        origin: { y: 0.4 },
        colors: colors
      });

      const end = Date.now() + 10_000;
      (function frame() {
        confetti({
          particleCount: 4,
          angle: 60,
          spread: 60,
          startVelocity: 40,
          origin: { x: 0, y: 0.7 },
          colors: colors
        });
        confetti({
          particleCount: 4,
          angle: 120,
          spread: 60,
          startVelocity: 40,
          origin: { x: 1, y: 0.7 },
          colors: colors
        });
        if (Date.now() < end) requestAnimationFrame(frame);
      })();
    }

    startBtn.addEventListener('click', () => {
      if (startBtn.disabled) return;
      startVideo();
    });

    // Block right-click and keyboard scrubbing on the video while it plays.
    document.getElementById('overlay').addEventListener('contextmenu', e => e.preventDefault());
    player.addEventListener('contextmenu', e => e.preventDefault());
    document.addEventListener('keydown', (e) => {
      if (videoSection.classList.contains('hidden')) return;
      const blocked = [' ', 'Spacebar', 'ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown',
                       'k', 'K', 'j', 'J', 'l', 'L', 'f', 'F', 'm', 'M',
                       'Home', 'End', 'PageUp', 'PageDown'];
      if (blocked.includes(e.key)) {
        e.preventDefault();
        e.stopPropagation();
      }
    }, true);
  </script>
</body>
</html>
